<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sm · 자기소개</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
  :root {
    --sky-50:  #f0f9ff;
    --sky-100: #e0f2fe;
    --sky-200: #bae6fd;
    --sky-400: #38bdf8;
    --sky-500: #0ea5e9;
    --sky-600: #0284c7;
    --slate-900: #0f172a;
    --slate-700: #334155;
    --slate-500: #64748b;
    --slate-200: #e2e8f0;
    --slate-100: #f1f5f9;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', sans-serif;
    color: var(--slate-700);
    background:
      radial-gradient(900px 500px at 50% -10%, #bae6fd 0%, rgba(186,230,253,0) 60%),
      linear-gradient(180deg, #f0f9ff 0%, #ffffff 100%);
    background-attachment: fixed;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Floating dots ---------- */
  .dots {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .dots span {
    position: absolute;
    display: block;
    width: var(--size, 6px);
    height: var(--size, 6px);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #bae6fd 0%, #38bdf8 90%);
    opacity: var(--op, 0.25);
    animation: float var(--dur, 20s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
    will-change: transform;
  }
  @keyframes float {
    0%, 100% { transform: translate(0, 0); }
    50%     { transform: translate(var(--dx, 20px), var(--dy, -30px)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .dots span { animation: none; }
  }

  /* ---------- Card ---------- */
  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    border: 1px solid var(--slate-200);
    border-radius: 24px;
    padding: 48px 36px 36px;
    text-align: center;
    box-shadow:
      0 1px 2px rgba(15, 23, 42, 0.04),
      0 24px 48px -24px rgba(14, 165, 233, 0.28);
  }
  .avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--sky-400) 0%, var(--sky-600) 100%);
    color: #fff;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: -0.02em;
    box-shadow: 0 10px 24px -8px rgba(14, 165, 233, 0.5);
  }
  .name {
    margin: 0 0 10px;
    font-size: 26px;
    font-weight: 700;
    color: var(--slate-900);
    letter-spacing: -0.02em;
  }
  .bio {
    margin: 0 0 24px;
    font-size: 15px;
    line-height: 1.6;
    color: var(--slate-500);
  }

  /* ---------- Tags with hover stagger ---------- */
  .tags {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 28px;
    min-height: 32px; /* reserve space so socials don't jump */
  }
  .tag {
    font-size: 13px;
    font-weight: 500;
    color: var(--sky-600);
    background: var(--sky-50);
    border: 1px solid var(--sky-100);
    padding: 6px 12px;
    border-radius: 999px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .45s ease, transform .45s ease;
  }
  .card:hover .tag,
  .card:focus-within .tag {
    opacity: 1;
    transform: translateY(0);
  }
  .card:hover .tag:nth-child(1),
  .card:focus-within .tag:nth-child(1) { transition-delay: 0ms; }
  .card:hover .tag:nth-child(2),
  .card:focus-within .tag:nth-child(2) { transition-delay: 100ms; }
  .card:hover .tag:nth-child(3),
  .card:focus-within .tag:nth-child(3) { transition-delay: 200ms; }
  .card:hover .tag:nth-child(4),
  .card:focus-within .tag:nth-child(4) { transition-delay: 300ms; }

  /* Touch devices (no hover): always show tags */
  @media (hover: none) {
    .tag { opacity: 1; transform: none; }
  }

  /* ---------- Socials ---------- */
  .socials {
    display: flex;
    justify-content: center;
    gap: 12px;
    padding-top: 24px;
    border-top: 1px solid var(--slate-100);
  }
  .social {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--slate-500);
    background: var(--slate-100);
    text-decoration: none;
    transition: color .18s ease, background-color .18s ease, transform .18s ease;
  }
  .social:hover {
    color: #fff;
    background: var(--sky-500);
    transform: translateY(-1px);
  }
  .social svg { width: 18px; height: 18px; }

  @media (max-width: 420px) {
    .card { padding: 40px 24px 32px; border-radius: 20px; }
    .avatar { width: 76px; height: 76px; font-size: 26px; }
    .name { font-size: 22px; }
  }
</style>
</head>
<body>
  <div class="dots" aria-hidden="true"></div>

  <main class="card">
    <div class="avatar" aria-hidden="true">sm</div>
    <h1 class="name">sm</h1>
    <p class="bio">아이들, 커피, 식물을 좋아합니다.</p>
    <div class="tags">
      <span class="tag">독서</span>
      <span class="tag">여행</span>
      <span class="tag">커피</span>
    </div>
    <div class="socials">
      <a class="social" href="#" aria-label="GitHub">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 .5C5.73.5.5 5.73.5 12A11.5 11.5 0 0 0 8.37 23.08c.58.11.79-.25.79-.56v-2c-3.2.7-3.87-1.37-3.87-1.37-.52-1.32-1.27-1.67-1.27-1.67-1.04-.71.08-.7.08-.7 1.15.08 1.75 1.18 1.75 1.18 1.02 1.75 2.67 1.24 3.32.95.1-.74.4-1.24.72-1.53-2.56-.29-5.26-1.28-5.26-5.7 0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.46.11-3.04 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0c2.19-1.49 3.15-1.18 3.15-1.18.62 1.58.23 2.75.11 3.04.74.81 1.18 1.84 1.18 3.1 0 4.43-2.7 5.4-5.27 5.69.41.36.78 1.07.78 2.15v3.18c0 .31.21.68.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5z"/>
        </svg>
      </a>
      <a class="social" href="https://instagram.com/gkdid1020" target="_blank" rel="noopener" aria-label="Instagram (@gkdid1020)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </a>
      <a class="social" href="#" aria-label="Email">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="3"/>
          <path d="m3 7 9 6 9-6"/>
        </svg>
      </a>
    </div>
  </main>

  <script>
    (function () {
      var container = document.querySelector('.dots');
      if (!container) return;
      var count = 30;
      for (var i = 0; i < count; i++) {
        var dot = document.createElement('span');
        var size  = Math.random() * 4 + 3;              // 3–7px
        var x     = Math.random() * 100;                // vw %
        var y     = Math.random() * 100;                // vh %
        var dx    = (Math.random() * 2 - 1) * 40;       // -40 ~ 40 px
        var dy    = (Math.random() * 2 - 1) * 40;
        var dur   = Math.random() * 12 + 16;            // 16–28s
        var delay = -Math.random() * 20;                // start mid-cycle
        var op    = Math.random() * 0.25 + 0.12;        // 0.12–0.37
        dot.style.left = x + '%';
        dot.style.top  = y + '%';
        dot.style.setProperty('--size',  size + 'px');
        dot.style.setProperty('--dx',    dx + 'px');
        dot.style.setProperty('--dy',    dy + 'px');
        dot.style.setProperty('--dur',   dur + 's');
        dot.style.setProperty('--delay', delay + 's');
        dot.style.setProperty('--op',    op);
        container.appendChild(dot);
      }
    })();
  </script>
<!-- NAME_EDITOR_START -->
<style>
#name-editor { position: sticky; top: 44px; z-index: 40; background: #fff; border: 1.5px solid #cfd8dc;
  padding: 10px 14px; margin: 4px auto 0; max-width: 210mm; border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08); font-size: 0.92em;
  font-family: 'Noto Sans KR','Malgun Gothic',sans-serif; color: #263238; }
#name-editor .ne-title { font-weight: 700; margin-bottom: 6px; }
#name-editor .ne-hint { font-weight: 400; color: #78909c; font-size: 0.85em; margin-left: 6px; }
#name-editor .ne-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 6px; }
#name-editor .ne-cell { display: flex; align-items: center; gap: 4px; background: #f5f7f9;
  padding: 4px 6px; border-radius: 4px; }
#name-editor .ne-orig { font-weight: 700; color: #37474f; min-width: 30px; }
#name-editor input { flex: 1; min-width: 0; padding: 3px 6px; border: 1px solid #b0bec5;
  border-radius: 4px; font: inherit; }
#name-editor .ne-actions { margin-top: 6px; display: flex; gap: 8px; }
#name-editor button { background: #eceff1; border: 1px solid #b0bec5; padding: 3px 10px;
  border-radius: 4px; cursor: pointer; font: inherit; font-size: 0.9em; color: #263238; }
#name-editor button:hover { background: #cfd8dc; }
.sn.changed { background: #fff59d; padding: 0 2px; border-radius: 2px; }
@media print { #name-editor { display: none; } .sn.changed { background: transparent; padding: 0; } }
</style>
<script>
(function() {
  var STUDENTS = ['하은','하영','주은','주현','미정','채원','예은'];
  var found = {};
  function wrap(node) {
    if (node.nodeType === 3) {
      var text = node.nodeValue;
      var re = new RegExp('(' + STUDENTS.join('|') + ')', 'g');
      if (!re.test(text)) return;
      var parent = node.parentNode;
      var frag = document.createDocumentFragment();
      var last = 0; re.lastIndex = 0; var m;
      while ((m = re.exec(text)) !== null) {
        if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
        var span = document.createElement('span');
        span.className = 'sn';
        span.setAttribute('data-original', m[1]);
        span.textContent = m[1];
        frag.appendChild(span);
        found[m[1]] = true;
        last = m.index + m[1].length;
      }
      if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      parent.replaceChild(frag, node);
    } else if (node.nodeType === 1 &&
        ['SCRIPT','STYLE','INPUT','TEXTAREA','BUTTON'].indexOf(node.tagName) === -1 &&
        node.id !== 'name-editor') {
      var kids = Array.prototype.slice.call(node.childNodes);
      for (var i = 0; i < kids.length; i++) wrap(kids[i]);
    }
  }
  function editor(detected) {
    if (detected.length === 0) return;
    var panel = document.createElement('div');
    panel.id = 'name-editor';
    var cells = detected.map(function(n) {
      return '<label class="ne-cell"><span class="ne-orig">' + n + '</span> → ' +
             '<input type="text" data-original="' + n + '" value="' + n + '" maxlength="6"></label>';
    }).join('');
    panel.innerHTML =
      '<div class="ne-title">✏️ 학생 이름 바꾸기 ' +
      '<span class="ne-hint">(문서에 나온 이름 ' + detected.length + '명 · 입력 즉시 반영 · 인쇄 시 숨김)</span></div>' +
      '<div class="ne-row">' + cells + '</div>' +
      '<div class="ne-actions">' +
      '<button type="button" id="ne-reset">원래대로</button>' +
      '<button type="button" id="ne-hide">패널 숨기기</button></div>';
    var toolbar = document.querySelector('.toolbar');
    if (toolbar && toolbar.parentNode) toolbar.parentNode.insertBefore(panel, toolbar.nextSibling);
    else document.body.insertBefore(panel, document.body.firstChild);
    var inputs = panel.querySelectorAll('input');
    for (var i = 0; i < inputs.length; i++) {
      inputs[i].addEventListener('input', function(e) {
        var orig = e.target.getAttribute('data-original');
        var v = e.target.value || orig;
        var spans = document.querySelectorAll('.sn[data-original="' + orig + '"]');
        for (var j = 0; j < spans.length; j++) {
          spans[j].textContent = v;
          if (v !== orig) spans[j].classList.add('changed');
          else spans[j].classList.remove('changed');
        }
      });
    }
    document.getElementById('ne-reset').addEventListener('click', function() {
      for (var i = 0; i < inputs.length; i++) {
        inputs[i].value = inputs[i].getAttribute('data-original');
        var evt = document.createEvent('Event'); evt.initEvent('input', true, true);
        inputs[i].dispatchEvent(evt);
      }
    });
    document.getElementById('ne-hide').addEventListener('click', function() {
      panel.style.display = 'none';
    });
  }
  function init() {
    wrap(document.body);
    var detected = STUDENTS.filter(function(n) { return found[n]; });
    editor(detected);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else { init(); }
})();
</script>
<!-- NAME_EDITOR_END -->
</body>
</html>
